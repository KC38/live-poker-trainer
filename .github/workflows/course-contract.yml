name: Course contract validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  course-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and check generated catalogs
        run: |
          npm run course:test
          npm run course:check

      # LPT-1027: curriculum splits retired openlesson seeds while motion pick
      # still pointed at them — catch that in CI, not on a discovery walk.
      - name: Motion-target openlesson seeds match catalog
        run: |
          python3 tools/ui_motion_targets.py check-seeds
          python3 tools/ui_motion_targets_test.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dart course catalog parser tests
        run: |
          flutter pub get
          flutter test test/models/course/course_catalog_test.dart \
            test/ui/course/lesson_table_layout_contract_test.dart \
            test/ui/course/lesson_table_drill_scene_test.dart \
            test/ui/course/lesson_copy_matches_felt_test.dart

      # The felt deal runs once per step: every lesson step, right and wrong
      # answers, Hint and rebuilds, with real (scaled) deal pacing (~3 min).
      - name: Deal runs once per lesson step
        env:
          DEAL_ONCE_SWEEP: "1"
        run: |
          flutter test test/ui/course/lesson_deal_once_test.dart \
            test/core/deal/felt_deal_ledger_test.dart

      - name: Functions course catalog parser tests
        working-directory: functions
        run: |
          npm ci
          npx vitest run src/course_catalog.test.ts
