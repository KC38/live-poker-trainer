# Provenance stubs for learning-platform media.
# Documents origin of existing brand and sound assets.

provenance:
  - id: provenance.internal.brand.v1
    summary: First-party brand assets checked into assets/brand/
    origin: internal
    assets:
      - assets/brand/app_icon.png
      - assets/brand/logo_mark.png
    createdBy: product
    notes: >
      App icon and logo mark owned internally. Used as temporary stand-ins for
      coach portrait placeholders until dedicated illustration lands.
    status: draft

  - id: provenance.internal.sounds.v1
    summary: First-party table SFX and shell ambient checked into assets/sounds/
    origin: internal
    assets:
      - assets/sounds/deal.wav
      - assets/sounds/chip.wav
      - assets/sounds/knock.wav
      - assets/sounds/fold.wav
      - assets/sounds/win.wav
      - assets/sounds/lounge_ambient.mp3
    createdBy: product
    notes: >
      Bundled audio already referenced by SoundService / SfxKind. Manifest
      entries map stable media IDs onto these paths without changing runtime
      loading yet.
    status: draft

  - id: provenance.figma.creative.pending.v1
    summary: Pending Figma exports for onboarding and section heroes
    origin: figma
    assets: []
    createdBy: creative
    notes: >
      fileKey/nodeId will be filled when creative bible frames are exported.
    status: draft
