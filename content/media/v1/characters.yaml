# Draft cast for learning-platform media.
# Visual identity is pedagogical presentation only — never a playing-style label.
# Schema: schemas/character.schema.json

characters:
  - id: character.coach.primary
    displayName: Meridian
    role: coach
    silhouetteNotes: >
      Calm upright half-portrait; clean collared layer under a dark lab coat or
      tailored jacket; soft gold pin-line accent; hands often resting near a
      felt edge or range card. Readable at phone thumbnail size without cartoon
      exaggeration.
    palette:
      - "#0A0E16" # bgDark
      - "#053528" # feltDark
      - "#D4A84B" # gold
      - "#F4F1EA" # cream
      - "#8B9BB0" # slate
    teachingPurpose: >
      Primary coach guide for orientation, decision framing, and calm
      post-hand debriefs across the felt laboratory.
    castingRestrictions: >
      Appearance must not imply a playing-style archetype (nit, LAG, TAG,
      maniac, station, etc.), nationality, ethnicity, gender stereotype, age
      caricature, or disability trope. Meridian is a teaching presence, not a
      table persona.

  - id: character.player.01
    displayName: Reed
    role: supporting
    silhouetteNotes: >
      Quiet observational aide; slim vertical silhouette; notebook or slate
      tablet at rest; muted slate and cream clothing; no aggressive posture.
    palette:
      - "#141C2B"
      - "#8B9BB0"
      - "#F4F1EA"
      - "#1A2436"
    teachingPurpose: >
      Pattern-spotting aide — helps learners notice public history and
      information that is already on the board.
    castingRestrictions: >
      Appearance must not imply a playing-style archetype. Do not cast Reed as
      "tight," "passive," or any tendency mascot.

  - id: character.player.02
    displayName: Ivy
    role: supporting
    silhouetteNotes: >
      Structured frameworks aide; clear geometric props (range grids, stacked
      chips as counting aids); composed stance; felt-green accent thread only.
    palette:
      - "#0C4A35"
      - "#D4A84B"
      - "#1A2436"
      - "#F4F1EA"
    teachingPurpose: >
      Structure and framework aide — introduces diagrams, decision trees, and
      reusable mental models.
    castingRestrictions: >
      Appearance must not imply a playing-style archetype. Ivy must not be
      styled as "TAG," "studious nerd," or any protected-class stereotype.

  - id: character.player.03
    displayName: Pike
    role: supporting
    silhouetteNotes: >
      Clock-and-pressure aide; upright, alert posture; subtle timer motif in
      props only (never frantic animation); gold muted accents.
    palette:
      - "#1E2A3D"
      - "#A67C2E"
      - "#E8C878"
      - "#8B9BB0"
    teachingPurpose: >
      Timing and pressure scaffolding — teaches when decisions are time-bound
      without gamifying anxiety.
    castingRestrictions: >
      Appearance must not imply a playing-style archetype (especially maniac or
      LAG). No aggressive or threatening body language.

  - id: character.player.04
    displayName: Moss
    role: supporting
    silhouetteNotes: >
      Geometry/math scaffolding aide; soft felt-green layers; calm seated or
      leaning pose with pot-fraction cards; never a calculator mascot face.
    palette:
      - "#053528"
      - "#2DB87A"
      - "#F4F1EA"
      - "#2A3548"
    teachingPurpose: >
      Pot geometry and sizing aide — clarifies fractions, SPR intuition, and
      chip commitments in plain language.
    castingRestrictions: >
      Appearance must not imply a playing-style archetype. Do not code Moss as
      "nit," "station," or any math-nerd caricature tied to identity.

  - id: character.player.05
    displayName: Sable
    role: supporting
    silhouetteNotes: >
      Multiway / table-texture aide; wider compositional presence; dark navy
      clothing with cream highlight; often shown with multiple seat markers,
      never with villain "type" badges.
    palette:
      - "#0A0E16"
      - "#1A2436"
      - "#F4F1EA"
      - "#D4A84B"
    teachingPurpose: >
      Multiway and table-texture aide — helps learners track who is still in
      and what that changes about decisions.
    castingRestrictions: >
      Appearance must not imply a playing-style archetype. Sable must never
      wear or display nit/LAG/TAG labels, colors as coded tendencies, or
      protected-class stereotypes.
