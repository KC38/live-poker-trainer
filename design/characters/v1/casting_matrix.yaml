# Casting matrix — character ↔ lesson role / archetype
#
# IMPORTANT: Visual identity ≠ playing style.
# Characters may be cast into many lesson roles. Appearing in a lesson about
# "nit tendencies" does NOT mean the character looks or "is" a nit. Archetype
# columns are pedagogical topics only.
#
# Roles: coach | supporting (from characters.yaml)
# lessonRole: instructional job in a lesson beat
# archetypeTopic: optional tendency topic under discussion (nullable)

meta:
  version: 1
  status: draft
  rule: >
    Many-to-many casting. Never bind a character's silhouette, wardrobe, or
    palette to a playing-style archetype. Tendency labels live in copy and
    diagrams, not in cast identity.

characters:
  - id: character.coach.primary
    displayName: Meridian
    castableLessonRoles:
      - orientation
      - decision_frame
      - debrief
      - encouragement_calm
      - concept_intro
    castableArchetypeTopics:
      - null_topic  # may narrate any topic without embodying it
      - nit
      - lag
      - tag
      - maniac
      - station
      - hero_baseline
    notes: Primary coach can present any archetype topic without visual coding.

  - id: character.player.01
    displayName: Reed
    castableLessonRoles:
      - observation
      - history_read
      - board_texture_notice
    castableArchetypeTopics:
      - null_topic
      - station
      - nit
    notes: >
      Observation aide. May appear in station/nit topic lessons; must not look
      passive or "tight" as identity.

  - id: character.player.02
    displayName: Ivy
    castableLessonRoles:
      - framework
      - diagram_guide
      - range_construction
    castableArchetypeTopics:
      - null_topic
      - tag
      - hero_baseline
    notes: >
      Framework aide. TAG-topic casting is topical only — no studious-archetype
      costume.

  - id: character.player.03
    displayName: Pike
    castableLessonRoles:
      - timing_pressure
      - clock_awareness
      - decision_urgency
    castableArchetypeTopics:
      - null_topic
      - maniac
      - lag
    notes: >
      Pressure scaffolding. Must never be costumed as aggressive or "LAG-coded."

  - id: character.player.04
    displayName: Moss
    castableLessonRoles:
      - pot_geometry
      - sizing_math
      - spr_intuition
    castableArchetypeTopics:
      - null_topic
      - nit
      - station
    notes: Math aide; no nit/station visual coding.

  - id: character.player.05
    displayName: Sable
    castableLessonRoles:
      - multiway
      - seat_map
      - table_texture
    castableArchetypeTopics:
      - null_topic
      - lag
      - tag
      - maniac
    notes: Multiway aide; no multi-villain "type" badges on the character art.

# Explicit many-to-many edges (sample). Expand as lessons are authored.
assignments:
  - characterId: character.coach.primary
    lessonRole: orientation
    archetypeTopic: null
  - characterId: character.coach.primary
    lessonRole: debrief
    archetypeTopic: lag
  - characterId: character.player.01
    lessonRole: observation
    archetypeTopic: station
  - characterId: character.player.02
    lessonRole: range_construction
    archetypeTopic: tag
  - characterId: character.player.03
    lessonRole: timing_pressure
    archetypeTopic: maniac
  - characterId: character.player.04
    lessonRole: pot_geometry
    archetypeTopic: null
  - characterId: character.player.05
    lessonRole: multiway
    archetypeTopic: null
  # Cross-casts proving many-to-many (same character, different topics)
  - characterId: character.player.01
    lessonRole: history_read
    archetypeTopic: nit
  - characterId: character.player.05
    lessonRole: table_texture
    archetypeTopic: lag
  - characterId: character.coach.primary
    lessonRole: concept_intro
    archetypeTopic: hero_baseline
